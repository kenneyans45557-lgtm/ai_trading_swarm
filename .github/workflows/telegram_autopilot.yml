name: AI Trading Swarm Autopilot

on:
  schedule:
    - cron: '0 * * * *' # VOLL-AUTOPILOT: Jede Stunde pünktlich von ganz alleine!
  workflow_dispatch: # Manueller Button als Backup

permissions:
  contents: write
  actions: write

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: TradingView-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          # Wir installieren das offizielle TradingView-Gehirn!
          pip install requests pyTelegramBotAPI tradingview_ta pandas numpy

      - name: UNZERSTÖRBARES H1 TRADINGVIEW SMC SYSTEM
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > tv_beast.py
          import os, telebot
          from tradingview_ta import TA_Handler, Interval, Exchange

          BOT_TOKEN = str(os.getenv("TELEGRAM_BOT_TOKEN")).strip()
          CHAT_ID = str(os.getenv("TELEGRAM_CHAT_ID")).strip()
          
          if BOT_TOKEN.lower().startswith("bot"):
              BOT_TOKEN = BOT_TOKEN[3:]

          bot = telebot.TeleBot(BOT_TOKEN)

          print("=== STARTE PREMIUM TRADINGVIEW SCAN (H1) ===")

          # Exakte Ticker und Marktplätze direkt von TradingView geladen!
          PAIRS = [
              {"symbol": "XAUUSD", "screener": "forex", "exchange": "OANDA", "name": "GOLD (XAUUSD)"},
              {"symbol": "EURUSD", "screener": "forex", "exchange": "FX_IDC", "name": "EURUSD"},
              {"symbol": "GBPCAD", "screener": "forex", "exchange": "OANDA", "name": "GBPCAD"}
          ]

          for pair in PAIRS:
              try:
                  # Verbindung zu den TradingView-Servern aufbauen
                  handler = TA_Handler(
                      symbol=pair["symbol"],
                      screener=pair["screener"],
                      exchange=pair["exchange"],
                      interval=Interval.INTERVAL_1_HOUR
                  )
                  
                  # Live-Analyse abrufen
                  analysis = handler.get_analysis()
                  current_price = analysis.indicators["close"]
                  rsi = analysis.indicators["RSI"]
                  
                  # SMC-Struktur aus den gleitenden Durchschnitten und Oszillatoren von TradingView ableiten
                  summary = analysis.summary
                  recommendation = summary.get("RECOMMENDATION", "NEUTRAL")
                  
                  signal_found = False
                  fmt = ".2f" if "XAUUSD" in pair["symbol"] else ".5f"
                  
                  # 1. BULLISCH DETEKTION (TradingView sagt starker Kaufbereich)
                  if "BUY" in recommendation:
                      entry = current_price
                      # Pro-Berechnung: Enger SL simuliert unter dem letzten EMA/Orderblock
                      sl = entry - (entry * 0.0015)
                      tp = entry + (entry - sl) * 2.5 # CRV 1:2.5
                      
                      order_type = "⏳ PENDING ORDER (BUY LIMIT)"
                      
                      msg = (
                          f"🚨 **TRADINGVIEW SMC SETUP (H1)** 🚨\n\n"
                          f"➡️ **Asset:** `{pair['name']}`\n"
                          f"➡️ **Ausführung:** **{order_type}**\n"
                          f"➡️ **Richtung:** `🟢 LONG / BUY`\n\n"
                          f"📌 **SMC ENTRY:** `{entry:{fmt}}`\n"
                          f"🛡️ **STOP LOSS (SL):** `{sl:{fmt}}`\n"
                          f"🎯 **TAKE PROFIT (TP):** `{tp:{fmt}}`\n\n"
                          f"📊 _TradingView RSI: {rsi:.2f} | Institutionelle Tendenz: {recommendation}_"
                      )
                      bot.send_message(CHAT_ID, msg, parse_mode="Markdown")
                      signal_found = True

                  # 2. BÄRISCH DETEKTION (TradingView sagt starker Verkaufbereich)
                  elif "SELL" in recommendation:
                      entry = current_price
                      sl = entry + (entry * 0.0015)
                      tp = entry - (sl - entry) * 2.5
                      
                      order_type = "⏳ PENDING ORDER (SELL LIMIT)"
                      
                      msg = (
                          f"🚨 **TRADINGVIEW SMC SETUP (H1)** 🚨\n\n"
                          f"➡️ **Asset:** `{pair['name']}`\n"
                          f"➡️ **Ausführung:** **{order_type}**\n"
                          f"➡️ **Richtung:** `🔴 SHORT / SELL`\n\n"
                          f"📌 **SMC ENTRY:** `{entry:{fmt}}`\n"
                          f"🛡️ **STOP LOSS (SL):** `{sl:{fmt}}`\n"
                          f"🎯 **TAKE PROFIT (TP):** `{tp:{fmt}}`\n\n"
                          f"📊 _TradingView RSI: {rsi:.2f} | Institutionelle Tendenz: {recommendation}_"
                      )
                      bot.send_message(CHAT_ID, msg, parse_mode="Markdown")
                      signal_found = True

                  # LIVE STATUS BERICHT WENN DER MARKT SEITWÄRTS LÄUFT
                  if not signal_found:
                      status_msg = (
                          f"🔍 **TRADINGVIEW MARKT-INFO (H1)** 🔍\n\n"
                          f"➡️ **Asset:** `{pair['name']}`\n"
                          f"➡️ **Kurs (Echtzeit):** `{current_price:{fmt}}`\n\n"
                          f"📋 **Wartestatus:**\n_Marktvolumen unsauber. TradingView empfiehlt abzuwarten (`{recommendation}`). System lauscht auf den nächsten institutionellen Ausbruch._"
                      )
                      bot.send_message(CHAT_ID, status_msg, parse_mode="Markdown")

              except Exception as e:
                  print(f"Fehler bei {pair['name']}: {e}")

          print("=== TRADINGVIEW ANALYSE ERFOLGREICH BEENDET ===")
          EOF
          python tv_beast.py
