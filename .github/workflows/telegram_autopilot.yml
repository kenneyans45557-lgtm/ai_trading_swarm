name: AI Trading Swarm Autopilot

on:
  schedule:
    - cron: '0 * * * *' # Der Autopilot läuft pünktlich jede Stunde von alleine!
  workflow_dispatch: # Manueller Button als Backup

permissions:
  contents: write
  actions: write

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Offizielle Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance pyTelegramBotAPI

      - name: SCHARFES H1 3-PAAR SMC PROFI-SYSTEM
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > h1_beast.py
          import os, telebot, yfinance as yf
          import pandas as pd
          import numpy as np

          BOT_TOKEN = str(os.getenv("TELEGRAM_BOT_TOKEN")).strip()
          CHAT_ID = str(os.getenv("TELEGRAM_CHAT_ID")).strip()
          
          if BOT_TOKEN.lower().startswith("bot"):
              BOT_TOKEN = BOT_TOKEN[3:]

          bot = telebot.TeleBot(BOT_TOKEN)

          print("=== STARTE STRIGENTEN SMC-SCAN (H1) ===")

          # GC=F ist wieder drin – durch den schnellen Lauf jetzt immer brandaktuell!
          PAIRS = {
              "GC=F": "GOLD (XAUUSD)",
              "EURUSD=X": "EURUSD",
              "GBPCAD=X": "GBPCAD"
          }

          for pair, clean_name in PAIRS.items():
              try:
                  ticker = yf.Ticker(pair)
                  df = ticker.history(interval="1h", period="14d") 
                  
                  if df is None or df.empty: continue
                  close_col = 'Close' if 'Close' in df.columns else 'close'
                  high_col = 'High' if 'High' in df.columns else 'high'
                  low_col = 'Low' if 'Low' in df.columns else 'low'
                  open_col = 'Open' if 'Open' in df.columns else 'open'
                      
                  if len(df) < 40: continue
                  
                  last_idx = len(df) - 1
                  current_price = df.iloc[last_idx][close_col]
                  
                  # --- SMC STRUKTUR ---
                  df['swing_high'] = (df[high_col] > df[high_col].shift(2)) & (df[high_col] > df[high_col].shift(1)) & \
                                     (df[high_col] > df[high_col].shift(-1)) & (df[high_col] > df[high_col].shift(-2))
                  df['swing_low'] = (df[low_col] < df[low_col].shift(2)) & (df[low_col] < df[low_col].shift(1)) & \
                                    (df[low_col] < df[low_col].shift(-1)) & (df[low_col] < df[low_col].shift(-2))
                  
                  highs_df = df[df['swing_high']]
                  lows_df = df[df['swing_low']]
                  
                  if len(highs_df) < 2 or len(lows_df) < 2: continue
                  
                  recent_high = highs_df.iloc[-1][high_col]
                  recent_low = lows_df.iloc[-1][low_col]
                  
                  signal_found = False
                  fmt = ".2f" if "GC=F" in pair else ".5f"
                  
                  # 1. BULLISCH DETEKTION
                  if current_price > df.iloc[last_idx-3][close_col]:
                      for i in range(last_idx - 1, last_idx - 25, -1):
                          if df.iloc[i][close_col] < df.iloc[i][open_col]:
                              ob_low = df.iloc[i][low_col]
                              ob_high = df.iloc[i][high_col]
                              
                              if ob_low <= current_price <= (ob_high + (ob_high - ob_low)*0.5):
                                  entry = current_price
                                  sl = ob_low - (ob_low * 0.0005)
                                  tp = recent_high if recent_high > entry else entry + (entry - sl) * 2.0
                                  
                                  order_type = "⚡ MARKET EXECUTION" if abs(current_price - entry) < (entry * 0.0005) else "⏳ PENDING ORDER (BUY LIMIT)"
                                  
                                  msg = (
                                      f"🚨 **SMC H1 INSTITUTIONAL SETUP** 🚨\n\n"
                                      f"➡️ **Asset:** `{clean_name}`\n"
                                      f"➡️ **Ausführung:** **{order_type}**\n"
                                      f"➡️ **Richtung:** `🟢 LONG / BUY`\n\n"
                                      f"📌 **SMC ENTRY:** `{entry:{fmt}}`\n"
                                      f"🛡️ **SMC STOP LOSS (SL):** `{sl:{fmt}}`\n"
                                      f"🎯 **SMC TAKE PROFIT (TP):** `{tp:{fmt}}`\n\n"
                                      f"📊 _Aktueller Marktpreis liegt bei: {current_price:{fmt}}_"
                                  )
                                  bot.send_message(CHAT_ID, msg, parse_mode="Markdown")
                                  signal_found = True
                                  break
                      if signal_found: continue

                  # 2. BÄRISCH DETEKTION
                  if current_price < df.iloc[last_idx-3][close_col]:
                      for i in range(last_idx - 1, last_idx - 25, -1):
                          if df.iloc[i][close_col] > df.iloc[i][open_col]:
                              ob_low = df.iloc[i][low_col]
                              ob_high = df.iloc[i][high_col]
                              
                              if (ob_low - (ob_high - ob_low)*0.5) <= current_price <= ob_high:
                                  entry = current_price
                                  sl = ob_high + (ob_high * 0.0005)
                                  tp = recent_low if recent_low < entry else entry - (sl - entry) * 2.0
                                  
                                  order_type = "⚡ MARKET EXECUTION" if abs(current_price - entry) < (entry * 0.0005) else "⏳ PENDING ORDER (SELL LIMIT)"
                                  
                                  msg = (
                                      f"🚨 **SMC H1 INSTITUTIONAL SETUP** 🚨\n\n"
                                      f"➡️ **Asset:** `{clean_name}`\n"
                                      f"➡️ **Ausführung:** **{order_type}**\n"
                                      f"➡️ **Richtung:** `🔴 SHORT / SELL`\n\n"
                                      f"📌 **SMC ENTRY:** `{entry:{fmt}}`\n"
                                      f"🛡️ **SMC STOP LOSS (SL):** `{sl:{fmt}}`\n"
                                      f"🎯 **SMC TAKE PROFIT (TP):** `{tp:{fmt}}`\n\n"
                                      f"📊 _Aktueller Marktpreis liegt bei: {current_price:{fmt}}_"
                                  )
                                  bot.send_message(CHAT_ID, msg, parse_mode="Markdown")
                                  signal_found = True
                                  break
                      if signal_found: continue

                  # LIVE STATUS BERICHT
                  if not signal_found:
                      target_ob_txt = "Suche nach neuem H1-Struktur-Impuls..."
                      for i in range(last_idx - 1, last_idx - 20, -1):
                          if df.iloc[i][close_col] < df.iloc[i][open_col]:
                              target_ob_txt = f"Warte auf tieferen Rücklauf in die H1-Kauf-Zone bei ca. `{df.iloc[i][high_col]:{fmt}}`"
                              break
                      
                      status_msg = (
                          f"🔍 **SMC H1 MARKT-INFO** 🔍\n\n"
                          f"➡️ **Asset:** `{clean_name}`\n"
                          f"➡️ **Kurs:** `{current_price:{fmt}}`\n\n"
                          f"📋 **Wartestatus:**\n_{target_ob_txt}_\n\n"
                          f"ℹ️ _H1-Filter aktiv. Keine falschen Einstiege mehr._"
                      )
                      bot.send_message(CHAT_ID, status_msg, parse_mode="Markdown")

              except Exception as e:
                  print(f"Fehler bei {clean_name}: {e}")

          print("=== SMC ANALYSE ERFOLGREICH BEENDET ===")
          EOF
          python h1_beast.py
