name: AI Trading Swarm Autopilot

on:
  schedule:
    - cron: '*/15 * * * *' # Scannt jetzt pünktlich alle 15 Minuten deine Turnier-Paare!
  workflow_dispatch: # Ermöglicht dir, den Scan jederzeit manuell per Button zu starten

permissions:
  contents: write
  actions: write

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Offizielle Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance pyTelegramBotAPI

      - name: SCHARFES M15 3-PAAR PROFI-SYSTEM
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > m15_beast.py
          import os, telebot, yfinance as yf
          import pandas as pd

          # Keys absolut sicher aus den GitHub-Secrets laden
          BOT_TOKEN = str(os.getenv("TELEGRAM_BOT_TOKEN")).strip()
          CHAT_ID = str(os.getenv("TELEGRAM_CHAT_ID")).strip()
          
          if BOT_TOKEN.lower().startswith("bot"):
              BOT_TOKEN = BOT_TOKEN[3:]

          bot = telebot.TeleBot(BOT_TOKEN)

          print("=== STARTE SOFORT-ANALYSE FÜR DEIN TURNIER ===")

          # Deine 3 Profi-Paare (Gold, Euro, GBP/CAD)
          PAIRS = {
              "GC=F": "GOLD (XAUUSD)",
              "EURUSD=X": "EURUSD",
              "GBPCAD=X": "GBPCAD"
          }

          for pair, clean_name in PAIRS.items():
              try:
                  ticker = yf.Ticker(pair)
                  # Holt die echten 15-Minuten-Kerzen (M15)
                  df = ticker.history(interval="15m", period="2d")
                  
                  if df is None or df.empty:
                      print(f"Keine Daten empfangen für {clean_name}")
                      continue
                      
                  # Spaltennamen vereinheitlichen
                  df.columns = [c.lower() for c in df.columns]
                  
                  if len(df) < 5:
                      continue
                      
                  last_idx = len(df) - 1
                  current_close = df.loc[last_idx, 'close']
                  prev_close = df.loc[last_idx-1, 'close']
                  
                  # Mathematisch saubere Trend-Idee für das M15-Setup
                  if current_close > prev_close:
                      setup_idee = "🟢 M15 TREND-ANALYSE: POTENZIELLER LONG-EINSTIEG"
                      details = "Die Bullen übernehmen das Volumen auf M15. Halte Ausschau nach Kauf-Setups!"
                  else:
                      setup_idee = "🔴 M15 TREND-ANALYSE: POTENZIELLER SHORT-EINSTIEG"
                      details = "Die Bären drücken den Kurs im M15-Chart. Halte Ausschau nach Verkaufs-Setups!"
                  
                  # Formatierung für die Nachkommastellen anpassen (Gold vs Forex)
                  fmt = ".2f" if "GC=F" in pair else ".5f"
                  
                  # Die Nachricht, die direkt auf dein Handy fliegt
                  msg = (
                      f"📊 **FUNDEDNEXT TURNIER-SCANNER** 📊\n\n"
                      f"➡️ **Asset:** `{clean_name}`\n"
                      f"➡️ **Aktueller Kurs:** `{current_close:{fmt}}`\n\n"
                      f"💡 **Analyse:**\n*{setup_idee}*\n"
                      f"📍 _{details}_\n\n"
                      f"🏁 _Überprüfe jetzt deinen Chart für den optimalen Entry!_"
                  )
                  
                  bot.send_message(CHAT_ID, msg, parse_mode="Markdown")
                  print(f"Erfolgreich gesendet: {clean_name}")
                  
              except Exception as e:
                  print(f"Fehler bei {clean_name}: {e}")

          print("=== ANALYSE ERFOLGREICH BEENDET ===")
          EOF
          python m15_beast.py
