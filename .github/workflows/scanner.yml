name: AI Trading Swarm Autopilot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: KI- & Finanz-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: BOMBENFESTER MARKT-SCAN
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > web_scanner.py
          import os, requests, re
          import pandas as pd
          import numpy as np
          import yfinance as yf

          # Holt die Daten sicher ab
          BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
          CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")

          FOREX_PAIRS = {
              "EURUSD=X": 0.0001, "GBPUSD=X": 0.0001, "USDJPY=X": 0.01, "AUDUSD=X": 0.0001,
              "USDCAD=X": 0.0001, "USDCHF=X": 0.0001, "NZDUSD=X": 0.0001, "EURGBP=X": 0.0001,
              "EURJPY=X": 0.01, "GBPJPY=X": 0.01, "EURCHF=X": 0.0001, "EURAUD=X": 0.0001,
              "EURCAD=X": 0.0001, "GBPAUD=X": 0.0001, "GBPCAD=X": 0.0001, "AUDJPY=X": 0.01,
              "CADJPY=X": 0.01, "CHFJPY=X": 0.01, "AUDCAD=X": 0.0001, "AUDNZD=X": 0.0001
          }

          def send_via_fallback(msg):
              # UMGEWANDELT: Wenn die normale API blockiert ist, schießen wir es über ein freies Web-Gateway ab
              try:
                  # Bereinigt den Token, falls GitHub Leerzeichen eingebaut hat
                  clean_token = str(BOT_TOKEN).strip()
                  clean_chat = str(CHAT_ID).strip()
                  
                  # Nutzt die unblockierbare HTTP-Get Methode direkt im Browser-Stil
                  url = f"https://telegram.org{clean_token}/sendMessage?chat_id={clean_chat}&text={msg}"
                  headers = {'User-Agent': 'Mozilla/5.0'}
                  res = requests.get(url, headers=headers, timeout=10)
                  if res.status_code == 200:
                      print("   -> PUSH-BENACHRICHTIGUNG ERFOLGREICH!")
                  else:
                      print(f"   ⚠️ Fallback meldet Code: {res.status_code} - Bitte überprüfe deine Secrets in den GitHub Settings!")
              except Exception as e:
                  print(f"   ⚠️ Netzwerkfehler im Cloud-Rechenzentrum: {e}")

          print("=== STARTE VERBESSERTEN WEB-AUTOPILOTEN ===")
          
          for pair, pip_val in FOREX_PAIRS.items():
              clean_name = pair.replace("=X", "")
              try:
                  ticker = yf.Ticker(pair)
                  df = ticker.history(interval="5m", period="5d")
                  if df is None or df.empty: continue
                  df.columns = [c.lower() for c in df.columns]
                  df = df.tail(30).reset_index(drop=True)
              except Exception: continue

              if len(df) < 5: continue
              last_idx = len(df) - 1
              current_close = df.loc[last_idx, 'close']
              
              trend = "neutral"
              if df.loc[last_idx-2, 'high'] < df.loc[last_idx, 'low']: trend = "LONG"
              elif df.loc[last_idx-2, 'low'] > df.loc[last_idx, 'high']: trend = "SHORT"
              
              if trend == "neutral": continue
              
              sl_pips = 15 if "JPY" in pair else 0.0015
              tp_pips = 30 if "JPY" in pair else 0.0030
              fmt = ".3f" if "JPY" in pair else ".5f"
              
              sl = current_close - sl_pips if trend == "LONG" else current_close + sl_pips
              tp = current_close + tp_pips if trend == "LONG" else current_close - tp_pips
              
              print(f"🚨 Volltreffer bei {clean_name}! Schicke Signal...")
              
              # Formatiert den Text absolut sauber für die Web-Leitung
              txt = f"🚨 SWARM-SIGNAL: {trend} 🚨\n\nPaar: {clean_name[:3]}/{clean_name[3:]}\nENTRY: {current_close:{fmt}}\nSL: {sl:{fmt}}\nTP: {tp:{fmt}}"
              send_via_fallback(txt)
              
          print("=== SCAN BEENDET ===")
          EOF
          python web_scanner.py
