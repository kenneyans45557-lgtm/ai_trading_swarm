name: AI Trading Swarm Autopilot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: KI- & Finanz-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: 100% UMGANGENES MARKT-MEETING
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cat << 'EOF' > core_scanner.py
          import os, requests, re
          import pandas as pd
          import numpy as np
          import yfinance as yf

          FOREX_PAIRS = {
              "EURUSD=X": 0.0001, "GBPUSD=X": 0.0001, "USDJPY=X": 0.01, "AUDUSD=X": 0.0001,
              "USDCAD=X": 0.0001, "USDCHF=X": 0.0001, "NZDUSD=X": 0.0001, "EURGBP=X": 0.0001,
              "EURJPY=X": 0.01, "GBPJPY=X": 0.01, "EURCHF=X": 0.0001, "EURAUD=X": 0.0001,
              "EURCAD=X": 0.0001, "GBPAUD=X": 0.0001, "GBPCAD=X": 0.0001, "AUDJPY=X": 0.01,
              "CADJPY=X": 0.01, "CHFJPY=X": 0.01, "AUDCAD=X": 0.0001, "AUDNZD=X": 0.0001
          }

          def get_historical_data(pair):
              try:
                  ticker = yf.Ticker(pair)
                  df = ticker.history(interval="5m", period="5d")
                  if df is None or df.empty: return None
                  df.columns = [c.lower() for c in df.columns]
                  return df.tail(30).reset_index(drop=True)
              except Exception: return None

          def analyze_high_frequency_fvg(df):
              if df is None or len(df) < 5: return "neutral", 0.0, 0.0
              last_idx = len(df) - 1
              current_close = df.loc[last_idx, 'close']
              if df.loc[last_idx-2, 'high'] < df.loc[last_idx, 'low']:
                  return "LONG", df.loc[last_idx-2, 'high'], current_close
              if df.loc[last_idx-2, 'low'] > df.loc[last_idx, 'high']:
                  return "SHORT", df.loc[last_idx-2, 'low'], current_close
              return "neutral", 0.0, current_close

          with open("signals.txt", "w") as f:
              for pair, pip_val in FOREX_PAIRS.items():
                  clean_name = pair.replace("=X", "")
                  df = get_historical_data(pair)
                  if df is None: continue
                  trend, target_level, live_price = analyze_high_frequency_fvg(df)
                  if trend == "neutral": continue
                  
                  sl_pips = 15 if "JPY" in pair else 0.0015
                  tp_pips = 30 if "JPY" in pair else 0.0030
                  fmt = ".3f" if "JPY" in pair else ".5f"
                  
                  if trend == "LONG":
                      sl = live_price - sl_pips
                      tp = live_price + tp_pips
                      f.write(f"ALERT_LONG_{clean_name}_{live_price:{fmt}}_{sl:{fmt}}_{tp:{fmt}}\n")
                  elif trend == "SHORT":
                      sl = live_price + sl_pips
                      tp = live_price - tp_pips
                      f.write(f"ALERT_SHORT_{clean_name}_{live_price:{fmt}}_{sl:{fmt}}_{tp:{fmt}}\n")
          print("-> Analyse erfolgreich in Datei geschrieben.")
          EOF
          python core_scanner.py

      - name: SIGNALE REIN ÜBER LINUX-CURL AN TELEGRAM SENDEN
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f signals.txt ]; then
            while IFS= read -r line; do
              if [[ $line == ALERT_* ]]; then
                # Zerlege die Zeile in saubere Variablen ohne Python-Konflikte
                IFS='_' read -r prefix trend pair entry sl tp <<< "$line"
                
                # Erstelle den sauberen Nachrichtentext
                TEXT="🚨 SWARM-SIGNAL: $trend 🚨%0A%0APaar: $pair%0AENTRY: $entry%0ASTOP-LOSS: $sl%0ATAKE-PROFIT: $tp%0A%0ALeitung steht zu 100 Prozent!"
                
                echo "Schieße Signal für $pair direkt über Netzwerk-Schnittstelle..."
                
                # Reiner Linux-Curl Befehl - stürzt niemals ab und kann nicht falsch geparst werden!
                curl -s -X POST "https://telegram.org{TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d "chat_id=${TELEGRAM_CHAT_ID}" \
                  -d "text=${TEXT}"
              fi
            done < signals.txt
          else
            echo "Keine Signale gefunden."
          fi
