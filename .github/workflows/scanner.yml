name: AI Trading Swarm Autopilot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: KI- & Finanz-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: KI-Schwarm Meeting ausführen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > inline_script.py
          import os, requests, re
          import pandas as pd
          import numpy as np
          import yfinance as yf

          HF_TOKEN = os.getenv("HF_TOKEN")
          TELEGRAM_BOT_TOKEN = os.getenv("TELEGRAM_BOT_TOKEN")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")

          FOREX_PAIRS = {
              "EURUSD=X": 0.0001, "GBPUSD=X": 0.0001, "USDJPY=X": 0.01, "AUDUSD=X": 0.0001,
              "USDCAD=X": 0.0001, "USDCHF=X": 0.0001, "NZDUSD=X": 0.0001, "EURGBP=X": 0.0001,
              "EURJPY=X": 0.01, "GBPJPY=X": 0.01, "EURCHF=X": 0.0001, "EURAUD=X": 0.0001,
              "EURCAD=X": 0.0001, "GBPAUD=X": 0.0001, "GBPCAD=X": 0.0001, "AUDJPY=X": 0.01,
              "CADJPY=X": 0.01, "CHFJPY=X": 0.01, "AUDCAD=X": 0.0001, "AUDNZD=X": 0.0001
          }

          def send_telegram_message(message):
              try:
                  url = f"https://telegram.org{TELEGRAM_BOT_TOKEN}/sendMessage"
                  payload = {
                      "chat_id": TELEGRAM_CHAT_ID,
                      "text": message
                      # parse_mode komplett entfernt, damit Telegram reinen Text ohne Formatierungsfehler einliest!
                  }
                  response = requests.post(url, json=payload, timeout=10)
                  if response.status_code == 200:
                      print("-> Info: Signal erfolgreich an Telegram gepusht!")
                  else:
                      print(f"-> Telegram API Fehler: {response.text}")
              except Exception as e:
                  print(f"-> Allgemeiner Telegram Fehler: {e}")

          def get_market_news(pair):
              clean_pair = pair.replace("=X", "")
              search = f"{clean_pair[:3]}+{clean_pair[3:]}"
              url = f"https://google.com{search}+forex&hl=en-US&gl=US&ceid=US:en"
              try:
                  response = requests.get(url, timeout=10)
                  headlines = re.findall(r"<title>(.*?)</title>", response.text)
                  return [h for h in headlines if h and "Google News" not in h][:3]
              except Exception: return []

          def get_historical_data(pair):
              try:
                  ticker = yf.Ticker(pair)
                  df = ticker.history(interval="5m", period="5d")
                  if df is None or df.empty: return None
                  df.columns = [c.lower() for c in df.columns]
                  return df.tail(30).reset_index(drop=True)
              except Exception: return None

          def analyze_high_frequency_fvg(df):
              if df is None or len(df) < 5: return "neutral", 0.0, 0.0
              last_idx = len(df) - 1
              current_close = df.loc[last_idx, 'close']
              
              if df.loc[last_idx-2, 'high'] < df.loc[last_idx, 'low']:
                  return "VOLUME_LONG", df.loc[last_idx-2, 'high'], current_close
                  
              if df.loc[last_idx-2, 'low'] > df.loc[last_idx, 'high']:
                  return "VOLUME_SHORT", df.loc[last_idx-2, 'low'], current_close
                  
              return "neutral", 0.0, current_close

          def analyze_sentiment_with_ki(headline):
              api_url = "https://huggingface.co"
              headers = {"Authorization": f"Bearer {HF_TOKEN}"}
              try:
                  response = requests.post(api_url, headers=headers, json={"inputs": headline}, timeout=15).json()
                  if isinstance(response, list) and len(response) > 0:
                      best_pick = max(response, key=lambda x: x['score'])
                      return best_pick['label'], best_pick['score']
                  return "neutral", 0.0
              except Exception: return "neutral", 0.0

          print("=== START DES AUTOMATISIERTEN TELEGRAM-TESTS ===")
          print("🤖 AGENT_ORCHESTRATOR: Verbinde KIs mit deinem Telegram...")
          
          for pair, pip_val in FOREX_PAIRS.items():
              clean_name = pair.replace("=X", "")
              df = get_historical_data(pair)
              if df is None: continue
              
              trend, target_level, live_price = analyze_high_frequency_fvg(df)
              if trend == "neutral": continue
              
              headlines = get_market_news(pair)
              total_score = 0
              for title in headlines:
                  label, score = analyze_sentiment_with_ki(title)
                  if label == "positive": total_score += score
                  elif label == "negative": total_score -= score
              
              sl_pips = 15 if "JPY" in pair else 0.0015
              tp_pips = 30 if "JPY" in pair else 0.0030
              fmt = ".3f" if "JPY" in pair else ".5f"
              
              # UMWANDELT: Reiner Text ohne störende HTML oder Markdown-Zeichen
              if trend == "VOLUME_LONG":
                  sl = live_price - sl_pips
                  tp = live_price + tp_pips
                  txt = f"TELEGRAM-TEST: LONG\n\n" \
                        f"Paar: {clean_name[:3]}/{clean_name[3:]}\n" \
                        f"ENTRY: {live_price:{fmt}}\n" \
                        f"STOP-LOSS: {sl:{fmt}}\n" \
                        f"TAKE-PROFIT: {tp:{fmt}}\n\n" \
                        f"Stimmungsscore: {total_score:.2f}\n" \
                        f"Die Leitung laeuft fehlerfrei!"
                  print(f"🚨 Volltreffer bei {clean_name}! Schieße Nachricht an Telegram...")
                  send_telegram_message(txt)
                  
              elif trend == "VOLUME_SHORT":
                  sl = live_price + sl_pips
                  tp = live_price - tp_pips
                  txt = f"TELEGRAM-TEST: SHORT\n\n" \
                        f"Paar: {clean_name[:3]}/{clean_name[3:]}\n" \
                        f"ENTRY: {live_price:{fmt}}\n" \
                        f"STOP-LOSS: {sl:{fmt}}\n" \
                        f"TAKE-PROFIT: {tp:{fmt}}\n\n" \
                        f"Stimmungsscore: {total_score:.2f}\n" \
                        f"Die Leitung laeuft fehlerfrei!"
                  print(f"🚨 Volltreffer bei {clean_name}! Sende Nachricht an Telegram...")
                  send_telegram_message(txt)
                  
          print("=== SCAN BEENDET ===")
          EOF
          python inline_script.py
