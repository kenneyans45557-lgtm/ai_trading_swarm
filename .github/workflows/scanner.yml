name: AI Trading Swarm Autopilot

on:
  schedule:
    - cron: '*/30 * * * *' # Startet vollautomatisch alle 30 Minuten
  workflow_dispatch: # Ermöglicht uns gleich den manuellen Teststart

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: KI-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: KI-Schwarm Meeting ausführen
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python main.py
