name: AI Trading Swarm Autopilot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: KI-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: KI-Schwarm Meeting ausführen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          cat << 'EOF' > inline_script.py
          import os, requests, smtplib, re
          from email.mime.text import MIMEText

          HF_TOKEN = os.getenv("HF_TOKEN")
          EMAIL_SENDER = os.getenv("EMAIL_SENDER")
          EMAIL_RECEIVER = os.getenv("EMAIL_RECEIVER")
          EMAIL_APP_PASSWORD = os.getenv("EMAIL_APP_PASSWORD")

          def send_email(subject, body):
              try:
                  msg = MIMEText(body)
                  msg['Subject'] = subject
                  msg['From'] = EMAIL_SENDER
                  msg['To'] = EMAIL_RECEIVER
                  with smtplib.SMTP_SSL('://gmail.com', 465) as server:
                      server.login(EMAIL_SENDER, EMAIL_APP_PASSWORD)
                      server.sendmail(EMAIL_SENDER, EMAIL_RECEIVER, msg.as_string())
                  print("-> Info: E-Mail-Update erfolgreich gesendet!")
              except Exception as e:
                  print(f"-> Fehler beim E-Mail-Versand: {e}")

          def get_market_news():
              print("🤖 AGENT_INSIDER startet News-Scraping über Yahoo Finance...")
              url = "https://yahoo.com"
              try:
                  response = requests.get(url, timeout=10)
                  headlines = re.findall(r"<title>(.*?)</title>", response.text)
                  # Filtert unbrauchbare Titel heraus
                  clean_headlines = [h for h in headlines if h and not h.startswith("Yahoo Finance") and "RSS" not in h]
                  return clean_headlines[:5]
              except Exception as e:
                  print(f"Fehler beim News holen: {e}")
                  return []

          def analyze_sentiment_with_ki(headline):
              api_url = "https://huggingface.co"
              headers = {"Authorization": f"Bearer {HF_TOKEN}"}
              try:
                  response = requests.post(api_url, headers=headers, json={"inputs": headline}, timeout=15).json()
                  if isinstance(response, dict) and "estimated_time" in response:
                      return "neutral", 0.0
                  if isinstance(response, list) and len(response) > 0:
                      # Manchmal liefert Hugging Face geschachtelte Listen zurück
                      data = response[0] if isinstance(response[0], list) else response
                      best_pick = max(data, key=lambda x: x['score'])
                      return best_pick['label'], best_pick['score']
                  return "neutral", 0.0
              except Exception:
                  return "neutral", 0.0

          print("=== START DES KI-SCHWARM-MEETINGS ===")
          print("🤖 AGENT_ORCHESTRATOR (CEO): Meeting gestartet. Prüfe globale Marktstimmung.")
          headlines = get_market_news()
          if not headlines:
              print("🤖 AGENT_INSIDER: Keine aktuellen Nachrichten gefunden. Meeting vertagt.")
          else:
              print(f"🔎 AGENT_INSIDER: Ich habe {len(headlines)} globale Schlagzeilen analysiert:")
              total_score, pos_count, neg_count = 0, 0, 0
              for idx, title in enumerate(headlines, 1):
                  label, score = analyze_sentiment_with_ki(title)
                  print(f"   Headline {idx}: '{title[:60]}...' -> KI-Wertung: {label.upper()} ({score:.2f})")
                  if label == "positive":
                      total_score += score
                      pos_count += 1
                  elif label == "negative":
                      total_score -= score
                      neg_count += 1
              print("\n--- DISKUSSION & AUSWERTUNG ---")
              print(f"📊 AGENT_QUANT: Technische Zusammenfassung vorliegend.")
              print(f"   Positive: {pos_count} | Negative: {neg_count} | Sentiment-Trend: {total_score:.2f}")
              print("\n🤖 AGENT_ORCHESTRATOR (CEO): Treffe finale Entscheidung...")
              if total_score > 0.3:
                  txt = f"STARKE BULLISCHE STIMMUNG AM MARKT DETEKTIERT!\nTrend-Score: {total_score:.2f}."
                  print(f"-> ENTSCHEIDUNG: {txt}")
                  send_email("🚀 KI-SCHWARM: Bullisches Markt-Signal!", txt)
              elif total_score < -0.3:
                  txt = f"STARK BÄRISCHE PANIK AM MARKT DETEKTIERT!\nTrend-Score: {total_score:.2f}."
                  print(f"-> ENTSCHEIDUNG: {txt}")
                  send_email("⚠️ KI-SCHWARM: Bärisches Markt-Signal!", txt)
              else:
                  print("-> ENTSCHEIDUNG: Marktstimmung neutral. Kein Trade freigegeben.")
          print("=== MEETING BEENDET ===")
          EOF
          python inline_script.py
