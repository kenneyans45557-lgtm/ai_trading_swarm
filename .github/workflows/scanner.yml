name: AI Trading Swarm Autopilot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: KI- & Finanz-Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: KI-Schwarm Meeting ausführen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          cat << 'EOF' > inline_script.py
          import os, requests, smtplib, re
          import pandas as pd
          import numpy as np
          import yfinance as yf
          from email.mime.text import MIMEText

          HF_TOKEN = os.getenv("HF_TOKEN")
          EMAIL_SENDER = os.getenv("EMAIL_SENDER")
          EMAIL_RECEIVER = os.getenv("EMAIL_RECEIVER")
          EMAIL_APP_PASSWORD = os.getenv("EMAIL_APP_PASSWORD")

          # 20 Forex-Paare mit korrekten Yahoo-TICKERN und Pip-Definitionen
          FOREX_PAIRS = {
              "EURUSD=X": 0.0001, "GBPUSD=X": 0.0001, "USDJPY=X": 0.01, "AUDUSD=X": 0.0001,
              "USDCAD=X": 0.0001, "USDCHF=X": 0.0001, "NZDUSD=X": 0.0001, "EURGBP=X": 0.0001,
              "EURJPY=X": 0.01, "GBPJPY=X": 0.01, "EURCHF=X": 0.0001, "EURAUD=X": 0.0001,
              "EURCAD=X": 0.0001, "GBPAUD=X": 0.0001, "GBPCAD=X": 0.0001, "AUDJPY=X": 0.01,
              "CADJPY=X": 0.01, "CHFJPY=X": 0.01, "AUDCAD=X": 0.0001, "AUDNZD=X": 0.0001
          }

          def send_email(subject, body):
              try:
                  msg = MIMEText(body)
                  msg['Subject'] = subject
                  msg['From'] = EMAIL_SENDER
                  msg['To'] = EMAIL_RECEIVER
                  with smtplib.SMTP_SSL('://gmail.com', 465) as server:
                      server.login(EMAIL_SENDER, EMAIL_APP_PASSWORD)
                      server.sendmail(EMAIL_SENDER, EMAIL_RECEIVER, msg.as_string())
                  print("-> Info: Brutales SMC-Signal erfolgreich gesendet!")
              except Exception as e:
                  print(f"-> Fehler beim E-Mail-Versand: {e}")

          def get_market_news(pair):
              # Bereinigt den Ticker für die Google Suche (z.B. EURUSD)
              clean_pair = pair.replace("=X", "")
              search = f"{clean_pair[:3]}+{clean_pair[3:]}"
              url = f"https://google.com{search}+forex&hl=en-US&gl=US&ceid=US:en"
              try:
                  response = requests.get(url, timeout=10)
                  headlines = re.findall(r"<title>(.*?)</title>", response.text)
                  return [h for h in headlines if h and "Google News" not in h][:3]
              except Exception: return []

          def get_historical_data(pair):
              try:
                  # UMGEWANDELT: Nutzt jetzt die offizielle yfinance Bibliothek statt roher URLs!
                  ticker = yf.Ticker(pair)
                  df = ticker.history(interval="15m", period="2d")
                  if df.empty:
                      return None
                  
                  # Spaltennamen in Kleinbuchstaben vereinheitlichen
                  df.columns = [c.lower() for c in df.columns]
                  return df.tail(60).reset_index(drop=True)
              except Exception as e: 
                  print(f"   ⚠️ Fehler beim Laden der Chartdaten für {pair}: {e}")
                  return None

          def analyze_brutal_smc(df):
              if df is None or len(df) < 25: return "neutral", 0.0, 0.0
              
              last_idx = len(df) - 1
              current_close = df.loc[last_idx, 'close']
              current_low = df.loc[last_idx, 'low']
              current_high = df.loc[last_idx, 'high']
              
              lookback_df = df.iloc[last_idx-21 : last_idx-1]
              highest_high_20 = lookback_df['high'].max()
              lowest_low_20 = lookback_df['low'].min()
              
              # 1. LONG TRIGGER: Liquidity Sweep
              if current_low < lowest_low_20 and current_close > lowest_low_20:
                  if df.loc[last_idx-2, 'high'] < df.loc[last_idx, 'low']:
                      for i in range(last_idx-1, 0, -1):
                          if df.loc[i, 'close'] < df.loc[i, 'open']:
                              ob_zone = df.loc[i, 'low']
                              return "BRUTAL_SMC_LONG", ob_zone, current_close
              
              # 2. SHORT TRIGGER: Liquidity Sweep
              if current_high > highest_high_20 and current_close < highest_high_20:
                  if df.loc[last_idx-2, 'low'] > df.loc[last_idx, 'high']:
                      for i in range(last_idx-1, 0, -1):
                          if df.loc[i, 'close'] > df.loc[i, 'open']:
                              ob_zone = df.loc[i, 'high']
                              return "BRUTAL_SMC_SHORT", ob_zone, current_close
                              
              return "neutral", 0.0, current_close

          def analyze_sentiment_with_ki(headline):
              api_url = "https://huggingface.co"
              headers = {"Authorization": f"Bearer {HF_TOKEN}"}
              try:
                  response = requests.post(api_url, headers=headers, json={"inputs": headline}, timeout=15).json()
                  if isinstance(response, list) and len(response) > 0:
                      best_pick = max(response, key=lambda x: x['score'])
                      return best_pick['label'], best_pick['score']
                  return "neutral", 0.0
              except Exception: return "neutral", 0.0

          print("=== START DES AUTONOMEN HIGH-END SMC-SCHWARM SCANNERs ===")
          print("🤖 AGENT_ORCHESTRATOR (CEO): Initiiere brutale SMC Markt-Rasterung.")
          
          for pair, pip_val in FOREX_PAIRS.items():
              clean_name = pair.replace("=X", "")
              print(f"\n🔄 Scanne: {clean_name[:3]}/{clean_name[3:]}")
              
              df = get_historical_data(pair)
              if df is None:
                  continue
                  
              smc_trend, ob_level, live_price = analyze_brutal_smc(df)
              
              if smc_trend == "neutral":
                  print(f"   📊 AGENT_QUANT: Keine institutionelle SMC-Struktur aktiv. Standby.")
                  continue
                  
              print(f"🚨 BRUTALES SETUP DETEKTIERT BEI: {clean_name[:3]}/{clean_name[3:]} 🚨")
              print(f"   📊 AGENT_QUANT: Liquidität abgefischt! Order-Block bei {ob_level:.5f}")
              
              headlines = get_market_news(pair)
              total_score = 0
              for title in headlines:
                  label, score = analyze_sentiment_with_ki(title)
                  if label == "positive": total_score += score
                  elif label == "negative": total_score -= score
                  
              print(f"   🔎 AGENT_INSIDER: Sentiment-Bestätigung: {total_score:.2f}")
              
              if smc_trend == "BRUTAL_SMC_LONG" and total_score >= -0.2:
                  sl = ob_level - (8 * pip_val)
                  tp = live_price + (45 * pip_val)
                  fmt = ".3f" if "JPY" in pair else ".5f"
                  
                  txt = f"🐋 INSTI-ALARM: BRUTALES SMC-SETUP (LONG)!\n\n" \
                        f"• Währungspaar: {clean_name[:3]}/{clean_name[3:]}\n" \
                        f"• Methode: Liquidity Sweep + FVG Rejection\n\n" \
                        f"🎯 ENTRY (Sofort): {live_price:{fmt}}\n" \
                        f"🛑 STOP-LOSS (SL): {sl:{fmt}} (Abgesichert unter dem Jagd-Tief)\n" \
                        f"🏁 TAKE-PROFIT (TP): {tp:{fmt}} (Ziel nächste Liquiditätszone)\n\n" \
                        f"Meldung: Smart Money hat die Kleinanleger rausgespült. Der Weg nach oben ist frei!"
                  print(f"   -> CEO: Signal freigegeben!")
                  send_email(f"🐋 SMC-MONSTER: {clean_name[:3]}/{clean_name[3:]} LONG!", txt)
                  
              elif smc_trend == "BRUTAL_SMC_SHORT" and total_score <= 0.2:
                  sl = ob_level + (8 * pip_val)
                  tp = live_price - (45 * pip_val)
                  fmt = ".3f" if "JPY" in pair else ".5f"
                  
                  txt = f"🐋 INSTI-ALARM: BRUTALES SMC-SETUP (SHORT)!\n\n" \
                        f"• Währungspaar: {clean_name[:3]}/{clean_name[3:]}\n" \
                        f"• Methode: Stop-Hunt über altem Hoch + FVG Entry\n\n" \
                        f"🎯 ENTRY (Sofort): {live_price:{fmt}}\n" \
                        f"🛑 STOP-LOSS (SL): {sl:{fmt}} (Abgesichert über dem Jagd-Hoch)\n" \
                        f"🏁 TAKE-PROFIT (TP): {tp:{fmt}}\n\n" \
                        f"Meldung: Institutioneller Short-Abverkauf nach Liquiditätsjagd gestartet!"
                  print(f"   -> CEO: Signal freigegeben!")
                  send_email(f"🐋 SMC-MONSTER: {clean_name[:3]}/{clean_name[3:]} SHORT!", txt)
                  
          print("\n=== GLOBALER MARKT-SCAN BEENDET. SCHWARM IM STANDBY. ===")
          EOF
          python inline_script.py
